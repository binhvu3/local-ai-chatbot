<!-- templates/register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Chatbot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
  <style>
    body {
      background-color: #f9f9f9;
    }
    .register-container {
      max-width: 400px;
      margin: 100px auto;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="ui segment">
      <h2 class="ui header">Register for Chatbot</h2>
      
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="ui {{ 'positive' if category == 'success' else 'negative' }} message">
              <ul class="list">
                <li>{{ message }}</li>
              </ul>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      
      <form class="ui form" method="POST" action="{{ url_for('register') }}">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" placeholder="Username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="Password" required>
        </div>
        <button class="ui green button" type="submit">Register</button>
      </form>
      
      <div class="ui divider"></div>
      <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
  </div>
</body>
</html>
