<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ]
  });"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body { transition: background-color 0.3s, color 0.3s; }
    body.dark-mode { background: #1a1a1a; color: #f5f5f5; }
    .dark-mode .ui.container,
    .dark-mode .ui.segments,
    .dark-mode .ui.segment,
    .dark-mode .ui.form input,
    .dark-mode .ui.header { background: #2a2a2a !important; color: #f5f5f5 !important; }
    .ui.toggle.checkbox { margin-top: 8px; }
    .message-image { max-width: 100%; max-height: 300px; margin-top: 10px; }
    .image-preview { max-width: 100px; max-height: 100px; margin-top: 10px; display: none; border-radius:5px; }
    .clear-image { cursor: pointer; display: none; margin-left:5px; }
    .loading { display: none; margin-top:10px; }
    .like-button { cursor:pointer; color:#999; margin-left:10px; }
    .like-button.active { color:#ff4d4d; }
    .like-count { font-size:0.9em; margin-left:5px; }
  </style>
</head>
<body>
  <div class="ui container" style="margin-top:30px;">
    <div class="ui grid">
      <div class="eight wide column"><h2 class="ui header">Simple Chatbot</h2></div>
      <div class="four wide column right aligned">
        <div class="ui toggle checkbox">
          <input type="checkbox" id="dark-mode-toggle">
          <label>Dark Mode</label>
        </div>
      </div>
      <div class="four wide column right aligned">
        <a href="{{ url_for('logout') }}" class="ui red button">Logout</a>
      </div>
    </div>

    <div id="chat-box" class="ui segments">
      {% for msg in messages %}
        <div class="ui segment user-message">
          <strong>You:</strong> {{ msg.user_text }}
          {% if msg.has_image %}
            <div><img src="{{ url_for('static', filename='uploads/' + msg.image_path.split('/')[-1]) }}" class="message-image"></div>
          {% endif %}
          <span class="like-button" onclick="toggleLike(this)"><i class="heart outline icon"></i><span class="like-count">0</span></span>
        </div>
        <div class="ui segment bot-message">
          <strong>Bot:</strong> {{ msg.bot_response|safe }}
          <span class="like-button" onclick="toggleLike(this)"><i class="heart outline icon"></i><span class="like-count">0</span></span>
        </div>
      {% endfor %}
    </div>

    <div class="loading">
      <div class="ui active inline loader"></div><span> Waiting for response...</span>
    </div>

    <form id="chat-form" class="ui form" enctype="multipart/form-data">
      <div class="field">
        <input name="message" placeholder="Type a message...">
      </div>
      <div class="field">
        <div class="image-upload-wrapper">
          <label for="image-upload" class="ui icon button">
            <i class="image icon"></i> Upload Image
          </label>
          <input type="file" id="image-upload" name="image" accept="image/*" style="display:none">
          <i class="close icon clear-image" id="clear-image"></i>
        </div>
        <img id="image-preview" class="image-preview">
        <button class="ui blue button" type="submit">Send</button>
      </div>
    </form>
  </div>

  <script>
  $(function() {
    if (sessionStorage.getItem('darkMode') === 'true') {
      $('body').addClass('dark-mode');
      $('#dark-mode-toggle').prop('checked', true);
    }

    $('#dark-mode-toggle').change(function() {
      const dm = $(this).is(':checked');
      $('body').toggleClass('dark-mode', dm);
      sessionStorage.setItem('darkMode', dm);
      $.post('/toggle-theme', JSON.stringify({ dark_mode: dm }), null, 'json');
    });

    $('#image-upload').change(function() {
      const [file] = this.files;
      if (file) {
        const url = URL.createObjectURL(file);
        $('#image-preview').attr('src', url).show();
        $('#clear-image').show();
      }
    });
    $('#clear-image').click(function() {
      $('#image-upload').val('');
      $('#image-preview').hide();
      $(this).hide();
    });

    // Send form
    $('#chat-form').submit(function(e) {
      e.preventDefault();
      const form = new FormData(this);
      $('.loading').show();
      $('#chat-form button, #chat-form input').prop('disabled', true);

      $.ajax({
        url: '/send',
        type: 'POST',
        data: form,
        processData: false,
        contentType: false,
        success: function(data) {
          $('.loading').hide();
          $('#chat-form button, #chat-form input').prop('disabled', false);

          // Build user segment
          let userHtml = $('<div>').text($('input[name=message]').val()).html();
          let userSegment = `<strong>You:</strong> ${userHtml}`;
          if (data.image) {
            userSegment += `<div><img src="data:image/jpeg;base64,${data.image}" class="message-image"></div>`;
            if (data.image_classification) {
              userSegment += `<div class="ui tiny label">Classification: ${$('<div>').text(data.image_classification).html()}</div>`;
            }
          }
          const $u = $(`<div class="ui segment user-message">${userSegment}</div>`);

          // Build bot segment
          let botHtml = $('<div>').html(data.response).html();
          const $b = $(`<div class="ui segment bot-message"><strong>Bot:</strong> ${botHtml}<span class="like-button" onclick="toggleLike(this)"><i class="heart outline icon"></i><span class="like-count">0</span></span></div>`);

          $('#chat-box').prepend($b).prepend($u);
          $('input[name=message]').val('');
          $('#image-upload').val(''); $('#image-preview, #clear-image').hide();

          renderMathInElement($b[0], {
            delimiters: [
              {left:'\\(', right:'\\)', display:false},
              {left:'\\[', right:'\\]', display:true}
            ]
          });
        },
        error: function() {
          $('.loading').hide();
          $('#chat-form button, #chat-form input').prop('disabled', false);
          alert('Error: Failed to get response.');
        }
      });
    });
  });

  function toggleLike(el) {
    $(el).toggleClass('active');
    const $count = $(el).find('.like-count');
    let n = parseInt($count.text(), 10);
    $count.text($(el).hasClass('active') ? n + 1 : n - 1);
  }
  </script>
</body>
</html>
